<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Study Planner App</h1>
        <nav>
            <ul>
                <li><a href="#tasks">Task Management</a></li>
                <li><a href="#calendar">Calendar</a></li>
                <li><a href="#timer">Timer</a></li>
                <li><a href="#progress">Progress Tracking</a></li>
                <li><a href="#notes">Notes</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="tasks">
            <h2>Task Management</h2>
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button onclick="addTask()">Add Task</button>
            <ul id="taskList"></ul>
        </section>
        <section id="calendar">
            <h2>Calendar</h2>
            <div id="calendarView"></div>
        </section>
        <section id="timer">
            <h2>Timer</h2>
            <button onclick="startTimer()">Start Timer</button>
            <div id="timerDisplay">00:00:00</div>
        </section>
        <section id="progress">
            <h2>Progress Tracking</h2>
            <progress id="progressBar" value="0" max="100"></progress>
            <div id="progressPercentage">0%</div>
        </section>
        <section id="notes">
            <h2>Notes</h2>
            <textarea id="notesInput" rows="10" placeholder="Write your notes here..."></textarea>
            <button onclick="saveNotes()">Save Notes</button>
            <div id="savedNotes"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Study Planner App</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
